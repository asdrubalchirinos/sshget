[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sshget"
version = "0.1.0"
description = "Download files or folders from any SSH server, with an interactive remote browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "asdrubalchirinos" }]
keywords = ["ssh", "sftp", "scp", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "paramiko>=3.4",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/asdrubalchirinos/sshget"
Repository = "https://github.com/asdrubalchirinos/sshget"

[project.scripts]
sshget = "sshget.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
